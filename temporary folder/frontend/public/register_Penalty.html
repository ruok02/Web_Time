<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약속 등록 (3/3) - 꼬옥!</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#1a202c',
                    },
                    fontFamily: {
                        'gyeongbok': ['GyeongbokgungSumunjangBodyText', 'sans-serif'],
                        'boardmark': ['SchoolSafeBoardMarker', 'sans-serif'],
                        'jalnan': ['YeogiOttaeJalnan', 'sans-serif'],
                        'gowoon': ['GowoonDodum', 'sans-serilf'],
                        'coding': ['EllisDigitalCoding', 'sans-serilf']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="/temporary folder/frontend/public/main.css">
    
    <script src="/temporary folder/frontend/public/register_Penalty.js" defer></script>
    <script src="/temporary folder/frontend/public/theme.js" defer></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

    <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-xl min-h-screen">
        
        <header class="py-4 px-4 border-b dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-30">
            <div class="flex items-center justify-between">
                <button onclick="window.location.href='/register_Calendar.html'" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                
                <h2 class="text-lg font-bold text-gray-800 dark:text-white font-gowoon">페널티 설정 (3/3)</h2>

                <button id="theme-toggle" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
            </div>
        </header>

        <main class="p-4 space-y-8">
            <h3 class="text-2xl font-bold text-gray-800 dark:text-white font-jalnan">지각 시 어떤 페널티를 적용할까요?</h3>

            <form id="step3Form" class="space-y-6">
                <div class="space-y-2">
                    <label for="penalty-details" class="block text-sm font-medium text-gray-700 dark:text-gray-300 font-gowoon">구체적인 페널티 내용을 적어주세요 (예: 1분당 1000원, 커피 쏘기)</label>
                    <textarea id="penalty-details" name="penalty" placeholder="예: 지각 10분 이상 시 벌금 5천원" required
                           class="w-full h-32 px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:ring-2 focus:ring-red-500 transition font-gowoon resize-none"></textarea>
                </div>
                
                <div class="flex items-center mt-2">
                    <input type="checkbox" id="no-penalty" class="mr-2 rounded text-indigo-600 dark:bg-gray-700">
                    <label for="no-penalty" class="text-sm text-gray-500 dark:text-gray-400 font-gowoon">페널티 없이 약속 이행만 목표해요</label>
                </div>

                <div class="h-20"></div> 
            </form>
        </main>

        <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto p-4 bg-white dark:bg-gray-800 shadow-t-lg border-t dark:border-gray-700 z-40">
             <button id="finishBtn" type="submit" form="step3Form"
                    class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition duration-300 shadow-lg font-boardmark text-base">
                완료하기
            </button>
        </div>

    </div>
</body>
</html>
