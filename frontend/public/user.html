<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬옥! - 회원 전용 페이지</title>
     
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#1a202c',
                    },
                    fontFamily: {
                        'gyeongbok': ['GyeongbokgungSumunjangBodyText', 'sans-serif'],
                        'boardmark' : ['SchoolSafeBoardMarker', 'sans-serif'],
                        'jalnan' : ['YeogiOttaeJalnan', 'sans-serif'],
                        'gowoon' : ['GowoonDodum', 'sans-serilf'],
                        'coding' : ['EllisDigitalCoding', 'sans-serilf']
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="./main.css">
    
    <script>
        // 12.01 변경사항. 기존 로컬 스토리지 체크 로직은 appointment.js로 이동했으나,
        // 페이지 로드 전 로그인 여부 체크는 여기에 유지하여 리다이렉트 속도를 높임.
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('ko_og_logged_in');
            if (!isLoggedIn) {
                alert('로그인이 필요한 페이지입니다.');
                window.location.href = '/login.html'; // 절대 경로 사용
            }
        });
    </script>
</head>

<body class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20"> 
    
    <div class="max-w-xl mx-auto p-4 sm:p-6 bg-white dark:bg-gray-800 shadow-xl min-h-screen">

         <header class="py-4 border-b-2 border-indigo-100 dark:border-indigo-800 mb-6 sticky top-0 bg-white dark:bg-gray-800 z-10">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-indigo-700 dark:text-indigo-400 font-jalnan">
                    <span class="text-4xl">📌</span> 꼬옥!
                </h1>
                <div class="flex items-center gap-3">
                    <button id="addAppointmentBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl shadow-md transition duration-300 transform hover:scale-105 active:scale-95 text-sm font-boardmark">
                        + 새 약속 등록
                    </button>
                    <button onclick="logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 font-semibold py-2 px-4 rounded-xl shadow-md transition duration-300 text-sm font-gowoon">
                        로그아웃
                    </button>
                </div>
            </div>
            <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm font-gowoon">회원 전용 약속 관리 페이지</p>
        </header>

        <main>
            <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-4 font-gowoon">다가오는 약속 목록</h2>
            
            <div id="appointment-list" class="space-y-4">
                <p id="empty-message" class="text-center text-gray-500 p-8 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700/50 font-gowoon">
                    등록된 약속이 없습니다. '새 약속 등록' 버튼을 눌러 첫 약속을 잡아보세요!
                </p>
            </div>
        </main>

        <div id="message-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4" onclick="closeModal()">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-100" onclick="event.stopPropagation()">
                <h3 class="text-xl font-bold mb-3 text-red-600 font-jalnan">알림</h3>
                <p id="modal-message" class="text-gray-700 mb-4 font-gowoon"></p>
                <button onclick="closeModal()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-semibold transition font-boardmark">확인</button>
            </div>
        </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-2xl border-t border-gray-200 dark:border-gray-700 z-40">
        <nav class="flex justify-around items-center h-16">
            
            <button id="nav-calendar" class="text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex flex-col items-center text-xs font-gowoon">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                달력
            </button>
            
            <button id="nav-home" class="text-indigo-600 dark:text-indigo-400 flex flex-col items-center text-xs font-gowoon">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                홈
            </button>
            
            <button id="nav-schedule" class="text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex flex-col items-center text-xs font-gowoon">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                조율
            </button>

        </nav>
    </div>


    <script src="./appointment.js" defer></script>
</body>

</html>
