<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약속 등록 (2/3) - 꼬옥!</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#1a202c',
                    },
                    fontFamily: {
                        'gyeongbok': ['GyeongbokgungSumunjangBodyText', 'sans-serif'],
                        'boardmark': ['SchoolSafeBoardMarker', 'sans-serif'],
                        'jalnan': ['YeogiOttaeJalnan', 'sans-serif'],
                        'gowoon': ['GowoonDodum', 'sans-serilf'],
                        'coding': ['EllisDigitalCoding', 'sans-serilf']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./main.css">
    
    <script src="./register_Calendar.js" defer></script>
    <script src="./theme.js" defer></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

    <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-xl min-h-screen">
        
        <header class="py-4 px-4 border-b dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-30">
            <div class="flex items-center justify-between">
                <button onclick="window.location.href='/register_Start.html'" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                
                <h2 class="text-lg font-bold text-gray-800 dark:text-white font-gowoon">날짜/시간대 선택 (2/3)</h2>

                <button id="theme-toggle" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 focus:outline-none">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
            </div>
        </header>

        <main class="p-4 space-y-6">
            <h3 id="appt-title-display" class="text-xl font-bold text-indigo-600 dark:text-indigo-400 font-jalnan"></h3>
            
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border dark:border-gray-700">
                
                <div class="flex justify-between items-center mb-4">
                    <button class="text-gray-500 dark:text-gray-400 font-bold hover:text-gray-700 transition text-2xl">
                        <
                    </button>
                    <span id="current-month" class="text-xl font-bold text-gray-800 dark:text-white font-gowoon">12월</span>
                    <button class="text-gray-500 dark:text-gray-400 font-bold hover:text-gray-700 transition text-2xl">
                        >
                    </button>
                    <span class="text-indigo-600 dark:text-indigo-400 text-sm font-boardmark">기간</span>
                </div>

                <div class="grid grid-cols-7 text-center text-sm font-semibold mb-2 font-gowoon">
                    <span class="text-red-500">일</span>
                    <span>월</span>
                    <span>화</span>
                    <span>수</span>
                    <span>목</span>
                    <span>금</span>
                    <span class="text-blue-500">토</span>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 text-center text-sm font-medium font-gowoon">
                    <span class="p-2"></span>
                    <span class="p-2">1</span>
                    <span class="p-2">2</span>
                    <span class="p-2">3</span>
                    <span class="p-2">4</span>
                    <span class="p-2">5</span>
                    <span class="p-2">6</span>
                    
                    <span data-date="2025-12-07" class="p-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 rounded">7</span>
                    <span data-date="2025-12-08" class="p-2 cursor-pointer bg-indigo-500 text-white rounded font-bold">8</span>
                    <span data-date="2025-12-09" class="p-2 cursor-pointer bg-indigo-500 text-white rounded font-bold">9</span>
                    <span data-date="2025-12-10" class="p-2 cursor-pointer bg-indigo-500 text-white rounded font-bold">10</span>
                    <span data-date="2025-12-11" class="p-2 cursor-pointer bg-indigo-500 text-white rounded font-bold">11</span>
                    <span data-date="2025-12-12" class="p-2 cursor-pointer bg-indigo-500 text-white rounded font-bold">12</span>
                    <span data-date="2025-12-13" class="p-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 rounded">13</span>
                    
                    <span class="p-2">14</span>
                    <span class="p-2">15</span>
                    <span class="p-2">16</span>
                    <span class="p-2">17</span>
                    <span class="p-2">18</span>
                    <span class="p-2">19</span>
                    <span class="p-2">20</span>

                    <span class="p-2">21</span>
                    <span class="p-2">22</span>
                    <span class="p-2">23</span>
                    <span class="p-2">24</span>
                    <span class="p-2">25</span>
                    <span class="p-2">26</span>
                    <span class="p-2">27</span>
                    
                    <span class="p-2">28</span>
                    <span class="p-2">29</span>
                    <span class="p-2">30</span>
                    <span class="p-2">31</span>
                </div>

            </div>

            <div class="space-y-4 pt-4">
                <p class="text-sm text-gray-700 dark:text-gray-300 font-gowoon">시간 범위를 선택하세요:</p>
                <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3">
                    <span class="text-lg text-indigo-600 dark:text-indigo-400 font-boardmark">09:00 부터</span>
                    <span class="text-lg text-indigo-600 dark:text-indigo-400 font-boardmark">18:00 까지</span>
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" id="skip-time-adjust" class="mr-2 rounded text-indigo-600 dark:bg-gray-700">
                    <label for="skip-time-adjust" class="text-sm text-gray-500 dark:text-gray-400 font-gowoon">시간 조율 없이 약속 날짜만 잡고 싶어요</label>
                </div>
            </div>
            
            <div class="h-20"></div>

        </main>

        <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto p-4 bg-white dark:bg-gray-800 shadow-t-lg border-t dark:border-gray-700 z-40">
             <button id="nextStepBtn" 
                    class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition duration-300 shadow-lg font-boardmark text-base">
                다음
            </button>
        </div>

    </div>
</body>
</html>
