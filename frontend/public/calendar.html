<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약속 달력 - 꼬옥!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'jalnan': ['YeogiOttaeJalnan', 'sans-serif'],
                        'gowoon': ['GowoonDodum', 'sans-serif'],
                        'boardmark': ['SchoolSafeBoardMarker', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./main.css">
    <script src="./calendar.js" defer></script>
    <script src="./theme.js" defer></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

    <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-xl min-h-screen">
        
        <header class="py-4 px-4 border-b dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-30">
            <div class="flex items-center justify-between">
                <button onclick="history.back()" class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h2 class="text-xl font-bold font-jalnan text-indigo-600 dark:text-indigo-400">약속 달력</h2>
                <div class="w-10"></div>
            </div>
        </header>

        <main class="p-6">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 border border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center mb-6">
                    <button id="prev-month-btn" class="text-3xl font-bold text-gray-400 hover:text-gray-600">‹</button>
                    <h3 id="current-month-display" class="text-2xl font-bold font-gowoon"></h3>
                    <button id="next-month-btn" class="text-3xl font-bold text-gray-400 hover:text-gray-600">›</button>
                </div>

                <div class="grid grid-cols-7 text-center text-sm font-bold mb-3 text-gray-600 dark:text-gray-400 font-gowoon">
                    <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 text-center text-lg font-medium font-gowoon">
                    <!-- JS로 채워짐 -->
                </div>
            </div>

            <div class="mt-8 text-center text-sm text-gray-500 font-gowoon">
                <span class="inline-block w-4 h-4 bg-red-500 rounded-full mr-2"></span> 약속 있는 날
            </div>
        </main>

        <!-- 하단 네비게이션 (user.html과 완전 동일) -->
        <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-2xl border-t border-gray-200 dark:border-gray-700 z-50">
            <nav class="flex justify-around items-center h-16">
                <button id="nav-calendar" class="text-indigo-600 dark:text-indigo-400 flex flex-col items-center text-xs font-gowoon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    달력
                </button>

                <button id="nav-home" class="text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 flex flex-col items-center text-xs font-gowoon">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    홈
                </button>

                <button id="nav-schedule" class="text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 flex flex-col items-center text-xs font-gowoon">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    조율
                </button>
            </nav>
        </div>
    </div>
</body>
</html>
