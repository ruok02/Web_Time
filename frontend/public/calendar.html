<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약속 달력 - 꼬옥!</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'jalnan': ['YeogiOttaeJalnan', 'sans-serif'],
                        'gowoon': ['GowoonDodum', 'sans-serif'],
                        'boardmark': ['SchoolSafeBoardMarker', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./main.css">
    <script src="./calendar.js" defer></script>
    <script src="./theme.js" defer></script>

    <!-- 달력 부분은 무조건 흰색으로 고정했음. -->
    <style>
        .calendar-card {
            background-color: white !important;
            border: 1px solid #e5e7eb;
        }
        .dark .calendar-card {
            background-color: white !important;
            border-color: #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20">

    <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-xl min-h-screen">
        
        <!-- 헤더 -->
        <header class="py-4 px-4 border-b dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-30">
            <div class="flex items-center justify-between">
                <button onclick="history.back()" class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>

                <h2 class="text-xl font-bold font-jalnan text-indigo-600 dark:text-indigo-400">약속 달력</h2>

                <!-- 다크모드 토글 버튼 (user.html와 같이 동일하게 설정) -->
                <button id="theme-toggle"
                    class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 focus:outline-none transition">
                    
                    <!-- 태양 아이콘 (라이트 모드일 때 보임) -->
                    <svg id="theme-toggle-light-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"></path>
                    </svg>

                    <!-- 달 아이콘 (다크 모드일 때 보임) -->
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 메인 달력 (흰색 고정!) -->
        <main class="p-6">
            <div class="calendar-card rounded-2xl shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <button id="prev-month-btn" class="text-3xl font-bold text-gray-400 hover:text-gray-700 transition">‹</button>
                    <h3 id="current-month-display" class="text-2xl font-bold font-gowoon text-gray-800"></h3>
                    <button id="next-month-btn" class="text-3xl font-bold text-gray-400 hover:text-gray-700 transition">›</button>
                </div>

                <div class="grid grid-cols-7 text-center text-sm font-bold mb-4 text-gray-600 font-gowoon">
                    <div class="text-red-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-blue-500">토</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 text-center text-lg font-medium font-gowoon text-gray-800">
                    <!-- JS에서 생성 -->
                </div>
            </div>

            <div class="mt-8 text-center text-sm font-gowoon">
                <span class="inline-block w-4 h-4 bg-red-500 rounded-full mr-2 align-middle"></span>
                <span class="text-gray-700 dark:text-white">약속 있는 날</span>
            </div>
        </main>

        <!-- 하단 네비 (user.html과 동일) -->
        <!-- 하단 네비게이션 (id 없애고 텍스트로만 동작하게) -->
<div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-2xl border-t border-gray-200 dark:border-gray-700 z-50">
    <nav class="flex justify-around items-center h-16">
        <button class="text-indigo-600 dark:text-indigo-400 flex flex-col items-center text-xs font-gowoon">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span>달력</span>
        </button>

        <button class="text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex flex-col items-center text-xs font-gowoon">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span>홈</span>
        </button>

        <button class="text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex flex-col items-center text-xs font-gowoon">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>조율</span>
        </button>
    </nav>
</div>
    </div>

    
<div id="message-modal"
     class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4"
     onclick="closeMessageModal()">
    <div id="modal-content" 
         class="bg-white dark:bg-gray-900 p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-100"
         onclick="event.stopPropagation()">
        <h3 class="text-xl font-bold mb-3 text-red-600 font-jalnan">알림</h3>
        <p id="modal-message" class="text-gray-700 dark:text-gray-300 mb-6 font-gowoon text-center"></p>
        <button onclick="closeMessageModal()"
                class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-bold transition font-boardmark shadow-lg">
            확인
        </button>
    </div>
</div>

<script>
    // 진짜 showMessage 함수 (appointment.js와 완전 동일!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!)
    function showMessage(message) {
        const modal = document.getElementById('message-modal');
        const msgElement = document.getElementById('modal-message');
        if (modal && msgElement) {
            msgElement.textContent = message;
            modal.classList.remove('hidden');
        } else {
            alert(message);
        }
    }

    // 모달 닫기 함수
    function closeMessageModal() {
        const modal = document.getElementById('message-modal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }

    // 페이지 로드 후 네비게이션 버튼 이벤트 강제 연결
    document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('nav button');
        buttons.forEach(btn => {
            const text = btn.textContent.trim();
            
            if (text.includes('홈')) {
                btn.onclick = () => window.location.href = 'user.html';
            }
            if (text.includes('조율')) {
                btn.onclick = () => showMessage('조율 기능은 곧 준비중입니다!');
            }
        });
    });

    // ESC 키로도 모달 닫기 → 학교 수업시간에 배웠던 내용으로 'keydown'으로 창 끄게 하기
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeMessageModal();
        }
    });
</script>
    
</body>
</html>
