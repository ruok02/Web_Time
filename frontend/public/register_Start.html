<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬옥! - 약속 등록 (1/3)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#1a202c',
                    },
                    fontFamily: {
                        'gyeongbok': ['GyeongbokgungSumunjangBodyText', 'sans-serif'],
                        'boardmark': ['SchoolSafeBoardMarker', 'sans-serif'],
                        'jalnan': ['YeogiOttaeJalnan', 'sans-serif'],
                        'gowoon': ['GowoonDodum', 'sans-serilf'],
                        'coding': ['EllisDigitalCoding', 'sans-serilf']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./main.css">
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">

    <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 shadow-xl min-h-screen">
        
        <header class="py-4 px-4 border-b dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-10">
            <div class="flex items-center">
                <button onclick="window.location.href='/user.html'" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                <h2 class="flex-grow text-center text-lg font-bold text-gray-800 dark:text-white font-gowoon mr-10">약속 등록 (1/3)</h2>
            </div>
        </header>

        <section class="gradient-bg h-64 p-6 flex flex-col justify-end text-white relative overflow-hidden">
            <h1 class="text-3xl font-extrabold font-jalnan leading-tight">
                쉽고 빠른 약속 정하기<br>
                모두의 시간
            </h1>
            <div class="absolute top-0 left-0 right-0 bg-indigo-900/50 text-xs py-1 px-4 flex justify-between items-center">
                <p class="font-gowoon">🚀 업데이트 소식 | 5개 이상의 조율 결과를 확인할 수 있어요.</p>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
             </div>
        </section>

        <main class="p-4 space-y-8 -mt-12 bg-white dark:bg-gray-800 rounded-t-xl z-20 relative">
            <h3 class="text-2xl font-bold text-gray-800 dark:text-white font-jalnan">어떤 약속인가요?</h3>

            <form id="step1Form" class="space-y-6">
               
                <div class="space-y-2">
                    <label for="appt-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 font-gowoon">약속 이름을 알려주세요</label>
                    <input type="text" id="appt-name" name="title" placeholder="약속 제목" required
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 transition font-gowoon">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 font-gowoon">약속 참여 인원을 알려주세요</label>
                    <div class="flex items-center border border-gray-300 dark:border-gray-600 rounded-lg">
                        <button type="button" id="decrement-btn" class="p-3 bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300 font-bold text-xl rounded-l-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                            -
                        </button>
                        <input type="number" id="participant-count" name="participants_count" value="4" min="1" readonly
                               class="flex-grow text-center text-lg font-bold bg-white dark:bg-gray-800 dark:text-white border-x border-gray-300 dark:border-gray-600 py-3 appearance-none font-jalnan">
                        <button type="button" id="increment-btn" class="p-3 bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300 font-bold text-xl rounded-r-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                            +
                        </button>
                    </div>
                    <div class="flex items-center mt-2">
                        <input type="checkbox" id="no-count" class="mr-2 rounded text-indigo-600 dark:bg-gray-700">
                        <label for="no-count" class="text-sm text-gray-500 dark:text-gray-400 font-gowoon">아직 인원수를 정하지 못했어요</label>
                    </div>
                </div>

                <div class="h-20"></div> </form>
        </main>

        <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto p-4 bg-white dark:bg-gray-800 shadow-t-lg border-t dark:border-gray-700">
             <button id="nextStepBtn" type="submit" form="step1Form"
                    class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition duration-300 shadow-lg font-boardmark text-base">
                다음
            </button>
        </div>

    </div>

    <script src="./register_Start.js" defer></script>
</body>
</html>
